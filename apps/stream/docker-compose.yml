services:
  stream:
    # Context η ρίζα του monorepo: το package-lock.json (npm workspaces) ζει εκεί.
    build:
      context: ../..
      dockerfile: apps/stream/Dockerfile
    restart: unless-stopped
    # Το default json-file δεν κάνει rotate: ή σκάει ο δίσκος, ή —όταν σκάσει—
    # σβήνεις το container και μαζί όλο το ιστορικό. 250MB φτάνουν για μέρες.
    # Προσοχή: επιβιώνουν του `restart`, όχι του `down` (νέο container).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Ο admin πρέπει να είναι προσιτός από το container του Caddy, όχι μόνο από
      # το loopback του δικού του. Δεν δημοσιεύεται θύρα προς τα έξω, και το basic
      # auth το κάνει το ίδιο το app.
      ADMIN_HOST: 0.0.0.0
      ADMIN_DB: ./data/stats.db
    ports:
      # Μόνο το RTMP: το OBS χτυπάει κατευθείαν εδώ, δεν περνάει από τον Caddy
      # (το Cloudflare proxy δεν περνάει το 1935 — το rtmp. record θέλει DNS only).
      - "1935:1935"
    volumes:
      # Ο server γράφει μέσα το jwt secret στο πρώτο boot — χωρίς mount χάνεται
      # σε κάθε recreate και ακυρώνονται όλα τα tokens.
      - ./config.json:/app/apps/stream/config.json
      - media:/app/apps/stream/media
      - data:/app/apps/stream/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?βάλε DOMAIN=stream.example.com στο .env}
      STREAM_HOST: stream
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Τα certificates. Χωρίς αυτό ο Caddy ξαναβγάζει cert σε κάθε recreate και
      # η Let's Encrypt το κόβει στο rate limit.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  media:
  data:
  caddy-data:
  caddy-config:
