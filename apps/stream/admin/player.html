<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<style>
  :root { color-scheme: light; --surface-1: #fcfcfb; --plane: #f9f9f7; --text-primary: #0b0b0b;
    --text-secondary: #52514e; --muted: #898781; --border: rgba(11, 11, 11, .1);
    --good: #0ca30c; --bad: #d33; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme=light])) { color-scheme: dark; --surface-1: #1a1a19; --plane: #0d0d0d;
      --text-primary: #fff; --text-secondary: #c3c2b7; --border: rgba(255, 255, 255, .1);
      --bad: #f66; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--plane); color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .spacer { flex: 1; }
  a { color: var(--text-secondary); }
  input, button { font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  input { min-width: 220px; font-variant-numeric: tabular-nums; }
  button { color: var(--text-secondary); cursor: pointer; }
  button:hover { color: var(--text-primary); }
  .card { background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; }

  /* Ο wrapper είναι το target του fullscreen (όχι το <video>) και το αγκυροβόλιο
     του overlay — δες σημείωση στο toggleFullscreen(). */
  .player { position: relative; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
  .player:fullscreen video, .player:-webkit-full-screen video { border-radius: 0; }

  /* Λευκά εικονίδια σκόπιμα εκτός --text-* tokens: η μπάρα κάθεται πάνω σε μαύρο
     βίντεο και σε light theme, όχι πάνω στο --surface-1 του card. */
  .controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center;
    gap: 4px; padding: 8px 10px; color: #fff;
    background: linear-gradient(to top, rgba(0, 0, 0, .75), rgba(0, 0, 0, 0) 100%);
    opacity: 0; transition: opacity .2s ease; pointer-events: none; border-radius: 0 0 6px 6px; }
  .controls.show { opacity: 1; pointer-events: auto; }
  /* :focus-within θα έδειχνε τη μπάρα και σε mouse click πάνω σε κουμπί (το click
     δίνει focus), παγώνοντάς την μόνιμα αφού το <video> δεν είναι πια focusable για
     να πάρει το focus πίσω. Το :focus-visible διακρίνει keyboard από mouse focus —
     το :has() είναι το μόνο σημείο που «βλέπει» focus-visible σε παιδί από τον γονέα.
     Σε browser χωρίς υποστήριξη :has() ο κανόνας απλώς αγνοείται (invalid selector)
     και το πληκτρολόγιο πέφτει πίσω στο nudgeControls από τα δικά του focus events. */
  .player:has(:focus-visible) .controls { opacity: 1; pointer-events: auto; }
  .controls .ctl { background: none; border: none; color: #fff; padding: 4px; border-radius: 4px;
    display: inline-flex; cursor: pointer; }
  .controls .ctl:hover { color: #fff; background: rgba(255, 255, 255, .15); }
  .controls .ctl:disabled { cursor: default; opacity: .6; }
  .controls .ctl:disabled:hover { background: none; }
  #volume { width: 70px; min-width: 0; padding: 0; background: none; border: none; accent-color: #fff; }
  .controls .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    letter-spacing: .02em; }
  .livedot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .4); }
  .live.on .livedot { background: #2ecc71; }
  .live.behind .livedot { background: #fff; }

  #status { margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
  #status.bad { color: var(--bad); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--good); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>

<header>
  <span class="dot" id="dot"></span>
  <h1>Player</h1>
  <span class="spacer"></span>
  <input id="path" value="/live/stream" spellcheck="false">
  <button id="load">Φόρτωση</button>
  <a href="/admin">στατιστικά</a>
</header>

<div class="card">
  <div class="player" id="player">
    <video id="video" muted playsinline></video>
    <div class="controls" id="controls">
      <button class="ctl" id="playPause" title="Play / Pause (space)" aria-label="Play / Pause">
        <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="ctl" id="stop" title="Stop" aria-label="Stop">
        <svg width="18" height="18" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="6" width="12" height="12"/></svg>
      </button>
      <button class="ctl" id="mute" title="Σίγαση (m)" aria-label="Σίγαση">
        <svg id="iconVolume" width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" d="M16.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
        <svg id="iconMuted" width="18" height="18" viewBox="0 0 24 24" hidden>
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" d="M15.5 9.5l5 5m0-5l-5 5"/>
        </svg>
      </button>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" title="Ένταση">
      <span class="spacer"></span>
      <button class="live" id="live" title="Live edge">
        <span class="livedot"></span>LIVE
      </button>
      <button class="ctl" id="fullscreen" title="Πλήρης οθόνη (f)" aria-label="Πλήρης οθόνη">
        <svg id="iconFsEnter" width="18" height="18" viewBox="0 0 24 24">
          <path fill="none" stroke="currentColor" stroke-width="2" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
        </svg>
        <svg id="iconFsExit" width="18" height="18" viewBox="0 0 24 24" hidden>
          <path fill="none" stroke="currentColor" stroke-width="2" d="M9 4v5H4M15 4v5h5M20 20v-5h-5M4 20v-5h5"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="status"></div>
</div>

<p class="hint">
  Ο preview μετράει ως κανονικός θεατής στα στατιστικά όσο παίζει — το Stop σταματάει πραγματικά
  τη λήψη, το pause όχι. Το muted είναι απαραίτητο για να ξεκινάει η αναπαραγωγή χωρίς κλικ·
  ήχος/παύση/fullscreen από τη μπάρα πάνω στο βίντεο (ή space, m, f).
</p>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const video = el("video"), input = el("path"), out = el("status"), player = el("player");
  const controls = el("controls"), playPauseBtn = el("playPause"), stopBtn = el("stop");
  const muteBtn = el("mute"), volumeSlider = el("volume"), liveBtn = el("live"), fsBtn = el("fullscreen");
  const iconPlay = el("iconPlay"), iconPause = el("iconPause");
  const iconVolume = el("iconVolume"), iconMuted = el("iconMuted");
  const iconFsEnter = el("iconFsEnter"), iconFsExit = el("iconFsExit");
  let hls, retry, stall, current;

  // Δύο ξεχωριστές έννοιες «σταματημένο»: το stopped (Stop, πραγματικό teardown) και
  // το userPaused (ο χρήστης πάτησε pause). Και τα δύο μπλοκάρουν το auto-retry —
  // αλλιώς ο stall detector ή το later() ζωντανεύουν μόνα τους ένα stream που ο
  // χρήστης σταμάτησε επίτηδες.
  let stopped = true, userPaused = false;

  // Fatal error ενώ ήταν σε pause: το ERROR/onerror handler δεν έκανε τίποτα ορατό
  // (σωστά, δεν κάνουμε auto-resume), αλλά το hls instance μπορεί να έχει μείνει
  // νεκρό. Το resumePlay() το ελέγχει για να ξέρει αν αρκεί video.play() ή χρειάζεται
  // πλήρες load(). Καθαρίζει σε κάθε επιτυχές load()/onplaying.
  let pendingFatalError = false;

  // Πόσο πίσω από το live edge μετράει ακόμα ως «live» — λίγο πάνω από ένα segment
  // (~2s, δες STALL_MS παρακάτω) ώστε το φυσιολογικό jitter να μη γυρίζει το dot.
  const LIVE_TOLERANCE = 4;

  // Πόσο αντέχουμε ένα waiting που δεν κλείνει — δες το onwaiting παρακάτω. Αρκετά
  // πάνω από τα 2s του segment, ώστε ένα κανονικό rebuffer να μη μετράει ως κοπή.
  const STALL_MS = 10000;

  function say(msg, bad) {
    out.textContent = msg;
    out.className = bad ? "bad" : "";
    el("dot").className = "dot" + (bad ? "" : " on");
  }

  // --- εικονίδια / ορατότητα μπάρας ---------------------------------------

  function updatePlayIcon() {
    const showPlay = stopped || video.paused;
    iconPlay.hidden = !showPlay;
    iconPause.hidden = showPlay;
  }

  let hideTimer;
  // Καλείται μετά από κάθε αλλαγή κατάστασης· αν παίζει κανονικά ξεκινάει
  // countdown για απόκρυψη, αλλιώς (pause/stopped) μένει μόνιμα ορατή — αλλιώς ο
  // χρήστης βλέπει μαύρη οθόνη χωρίς τρόπο να ξαναπατήσει play.
  function syncControls() {
    clearTimeout(hideTimer);
    if (stopped || userPaused || video.paused) {
      controls.classList.add("show");
      return;
    }
    hideTimer = setTimeout(() => controls.classList.remove("show"), 2000);
  }

  // Κίνηση ποντικιού/tap: δείξε τη μπάρα και ξαναφόρτωσε το countdown απόκρυψης.
  function nudgeControls() {
    controls.classList.add("show");
    syncControls();
  }
  player.addEventListener("mousemove", nudgeControls);
  player.addEventListener("touchstart", nudgeControls, { passive: true });
  video.addEventListener("click", nudgeControls);

  // Το drag πάνω στο slider δεν παράγει mousemove πάνω στο .player αν το ποντίκι
  // μένει ακίνητο πάνω στο thumb ενώ η τιμή αλλάζει, και το :focus-visible δεν
  // ενεργοποιείται σε mouse interaction — οπότε κρατάμε τη μπάρα ορατή από εδώ.
  volumeSlider.addEventListener("pointerdown", nudgeControls);
  volumeSlider.addEventListener("input", nudgeControls);

  video.onplay = () => { updatePlayIcon(); syncControls(); };
  video.onpause = () => { updatePlayIcon(); syncControls(); };

  video.onplaying = () => {
    clearTimeout(stall);
    pendingFatalError = false; // αν αυτοθεραπεύτηκε χωρίς νέο load(), δεν είναι πια νεκρό
    say(`live · ${video.videoWidth}x${video.videoHeight}`);
    updatePlayIcon();
    syncControls();
  };

  // Restart του OBS: το postPublish σβήνει τον φάκελο κι ο ffmpeg ξαναρχίζει από
  // media sequence 0 με καινούριο timeline. Ο hls.js δεν το θεωρεί σφάλμα — απλώς
  // βάζει τα νέα fragments πίσω από το currentTime και η αναπαραγωγή κολλάει για
  // πάντα, χωρίς ποτέ fatal error να πιάσει το ERROR handler. Το μόνο αξιόπιστο
  // σημάδι είναι ένα waiting που δεν κλείνει, και ξεκολλάει μόνο με καινούριο Hls
  // (το loadSource πάνω στο ίδιο instance κρατάει το παλιό timeline).
  video.onwaiting = () => {
    // Σκόπιμο pause/stop: δεν είναι κόλλημα, είναι ο χρήστης — μη σκεδουλάρεις retry.
    if (stopped || userPaused) return;
    clearTimeout(stall);
    stall = setTimeout(() => {
      say("το stream κόπηκε, επανασύνδεση…", true);
      load(current);
    }, STALL_MS);
  };

  // --- live edge indicator -------------------------------------------------

  function liveEdge() {
    if (hls?.liveSyncPosition != null) return hls.liveSyncPosition;
    if (video.seekable.length) return video.seekable.end(video.seekable.length - 1);
    return null;
  }

  function jumpToLiveEdge() {
    const edge = liveEdge();
    if (edge != null) {
      try { video.currentTime = edge; } catch {}
    }
  }

  function updateLiveIndicator() {
    if (stopped) {
      liveBtn.classList.remove("on", "behind");
      liveBtn.disabled = true;
      return;
    }
    const edge = liveEdge();
    if (edge == null) {
      liveBtn.classList.remove("on", "behind");
      liveBtn.disabled = true;
      return;
    }
    const behind = (edge - video.currentTime) > LIVE_TOLERANCE;
    liveBtn.classList.toggle("on", !behind);
    liveBtn.classList.toggle("behind", behind);
    liveBtn.disabled = !behind;
  }
  video.ontimeupdate = updateLiveIndicator;

  liveBtn.onclick = () => {
    if (!liveBtn.classList.contains("behind")) return;
    if (video.paused) return resumePlay();
    jumpToLiveEdge();
  };

  // --- play / pause / stop --------------------------------------------------

  function userPause() {
    userPaused = true;
    clearTimeout(stall); // σκόπιμο pause: ο stall detector δεν πρέπει να ξυπνήσει το stream
    video.pause();
  }

  function resumePlay() {
    userPaused = false;
    if (pendingFatalError) {
      // Το hls instance πέθανε ενώ ήμασταν σε pause· ένα σκέτο video.play() δεν θα
      // κάνει τίποτα ορατό. Πλήρες load() αντί για jump+play — το ίδιο μονοπάτι με
      // stopped, όχι το φθηνό.
      pendingFatalError = false;
      return load(current);
    }
    jumpToLiveEdge(); // αλλιώς συνεχίζει από εκεί που πάγωσε και μένει μόνιμα πίσω από το live window
    video.play().catch(() => say("πάτα play", true));
  }

  function togglePlayPause() {
    if (stopped) return load(current);
    if (video.paused) return resumePlay();
    userPause();
  }
  playPauseBtn.onclick = togglePlayPause;

  function stop() {
    stopped = true;
    userPaused = false;
    clearTimeout(retry);
    clearTimeout(stall);
    hls?.destroy();
    hls = null;
    video.pause();
    video.removeAttribute("src");
    video.load(); // καθαρίζει src/buffer — αλλιώς ο preview συνεχίζει να μετράει ως θεατής
    updatePlayIcon();
    updateLiveIndicator();
    syncControls();
    say("σταματημένο");
  }
  stopBtn.onclick = stop;

  // --- ήχος ------------------------------------------------------------------

  function updateVolumeUI() {
    iconVolume.hidden = video.muted;
    iconMuted.hidden = !video.muted;
    volumeSlider.value = video.muted ? 0 : video.volume;
  }
  video.onvolumechange = updateVolumeUI;
  muteBtn.onclick = () => { video.muted = !video.muted; };
  volumeSlider.oninput = () => {
    video.volume = Number(volumeSlider.value);
    video.muted = video.volume === 0;
  };

  // --- fullscreen --------------------------------------------------------

  // Fullscreen στο wrapper, όχι στο <video>: αν ζητηθεί στο ίδιο το video element
  // το overlay μας μένει έξω από το fullscreen surface και εξαφανίζεται.
  function toggleFullscreen() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      return;
    }
    if (player.requestFullscreen) player.requestFullscreen();
    else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS Safari: μόνο το <video>, όχι container
  }
  fsBtn.onclick = toggleFullscreen;

  function updateFsIcon() {
    // Το iOS webkitEnterFullscreen() βάζει fullscreen στο ίδιο το <video>, όχι στο
    // document — video.webkitDisplayingFullscreen είναι το μόνο σημάδι εκεί.
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement
      || video.webkitDisplayingFullscreen);
    iconFsEnter.hidden = on;
    iconFsExit.hidden = !on;
  }
  document.addEventListener("fullscreenchange", updateFsIcon);
  document.addEventListener("webkitfullscreenchange", updateFsIcon);
  // iOS Safari: το webkitEnterFullscreen() πυροδοτεί αυτά πάνω στο <video>, ποτέ
  // document-level webkitfullscreenchange — χωρίς αυτά το εικονίδιο κολλάει.
  video.addEventListener("webkitbeginfullscreen", updateFsIcon);
  video.addEventListener("webkitendfullscreen", updateFsIcon);

  // --- keyboard shortcuts -----------------------------------------------

  document.addEventListener("keydown", (e) => {
    // Όχι μόνο το #path: focus σε #volume ή σε οποιοδήποτε κουμπί της μπάρας πρέπει
    // να πάει το space/enter στο ίδιο το στοιχείο — αλλιώς π.χ. focus στο mute κάνει
    // ταυτόχρονα toggle mute (native) ΚΑΙ togglePlayPause (global shortcut).
    if (e.target.closest("input, button, select, textarea")) return;
    const key = e.key.toLowerCase();
    if (key === " " || key === "k") { e.preventDefault(); togglePlayPause(); }
    else if (key === "m") muteBtn.click();
    else if (key === "f") toggleFullscreen();
  });

  // --- το πάντα αυτό ---------------------------------------------------

  // Το stream μπορεί να μην εκπέμπει ακόμα: ξαναδοκιμάζουμε αντί να πεθάνει η σελίδα.
  function later(src) {
    if (stopped || userPaused) return; // ίδιο guard με το onwaiting — βλ. σχόλιο γραμμές 127-131
    clearTimeout(retry);
    retry = setTimeout(() => load(src), 3000);
  }

  function load(src) {
    clearTimeout(retry);
    clearTimeout(stall);
    hls?.destroy();
    hls = null;
    current = src;
    stopped = false;
    userPaused = false;
    pendingFatalError = false;
    say("σύνδεση…");
    updatePlayIcon();
    updateLiveIndicator();
    syncControls();

    // Πρώτα το hls.js, μετά το native — ποτέ ανάποδα. Το canPlayType δεν είναι
    // δήλωση υποστήριξης: ο Chrome απαντάει "maybe" στο vnd.apple.mpegurl χωρίς
    // να παίζει HLS, οπότε το <video src> έμενε για πάντα σε readyState 0 —
    // χωρίς error event, δηλαδή ούτε καν retry, μόνιμο "σύνδεση…".
    if (window.Hls?.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => say("πάτα play", true)));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal || stopped) return;
        // Σκόπιμο pause: ενημέρωσε το status αλλά μη ξαναρχίσεις την αναπαραγωγή
        // μόνη της — ο χρήστης θα πατήσει play όποτε θέλει (και τότε θα ξέρει γιατί
        // ίσως δεν προχωράει). Το later() θα το μπλόκαρε ούτως ή άλλως, αλλά το
        // μήνυμα "νέα προσπάθεια…" θα ήταν ψέμα αν δεν προσπαθήσουμε πραγματικά.
        if (userPaused) {
          pendingFatalError = true; // ώστε το επόμενο play να κάνει load() αντί για video.play() σε νεκρό hls
          return say(`${d.details} (σε παύση, δεν συνεχίζει μόνο του)`, true);
        }
        say(`${d.details}, νέα προσπάθεια…`, true);
        later(src);
      });
      hls.loadSource(src);
      return hls.attachMedia(video);
    }

    // Safari: δεν έχει MSE για TS, αλλά παίζει HLS native
    if (!video.canPlayType("application/vnd.apple.mpegurl")) {
      return say("ο browser δεν υποστηρίζει HLS", true);
    }
    video.src = src;
    video.onerror = () => {
      if (stopped) return;
      if (userPaused) {
        pendingFatalError = true;
        return say("σφάλμα φόρτωσης (σε παύση, δεν συνεχίζει μόνο του)", true);
      }
      say("δεν παίζει, νέα προσπάθεια…", true);
      later(src);
    };
    video.play().catch(() => say("πάτα play", true));
  }

  function start() {
    const path = input.value.trim().replace(/\/+$/, "");
    history.replaceState(null, "", "?stream=" + encodeURIComponent(path));
    load(path + "/index.m3u8");
  }

  input.value = new URLSearchParams(location.search).get("stream") || input.value;
  el("load").onclick = start;
  input.onkeydown = (e) => e.key === "Enter" && start();
  updateVolumeUI();
  updatePlayIcon();
  start();
</script>
