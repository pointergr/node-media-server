services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      DATABASE_URL: file:./data/api.db
      JWT_SECRET: ${JWT_SECRET:?βάλε JWT_SECRET στο .env — ίδιο σε κάθε restart, αλλιώς αποσυνδέονται όλοι}
      PORT: 3000
    volumes:
      # Named volume: το sqlite πρέπει να επιβιώνει το recreate του container.
      - data:/app/apps/api/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?βάλε DOMAIN=panel.example.com στο .env}
      API_HOST: api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  data:
  caddy-data:
  caddy-config:
