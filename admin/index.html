<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream server</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, .1);
    --good: #0ca30c;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme=light])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-primary: #fff;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, .1);
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--plane);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: var(--text-secondary); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  .spacer { flex: 1; }
  .ranges { display: flex; gap: 4px; }
  button {
    font: inherit; color: var(--text-secondary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { color: var(--text-primary); }
  button[aria-pressed=true] { color: var(--text-primary); border-color: var(--axis); font-weight: 600; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .tile .value small { font-size: 14px; font-weight: 400; color: var(--text-secondary); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .chart { position: relative; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 2;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
  }
  .tip b { font-weight: 600; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid);
  }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; padding-right: 16px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .kill {
    color: var(--text-secondary); border-color: var(--border);
    padding: 2px 8px; font-size: 12px;
  }
  .scroll { overflow-x: auto; }
</style>

<header>
  <span class="dot" id="dot"></span>
  <h1>Stream server</h1>
  <span class="spacer"></span>
  <button class="kill" id="restart">Restart</button>
  <div class="ranges" id="ranges"></div>
</header>

<div class="card tiles" id="tiles"></div>

<div class="card">
  <h2>Ενεργά streams</h2>
  <div class="scroll" id="streams"></div>
</div>

<div class="charts" id="charts">
  <div class="card"><h2>Bitrate εισόδου</h2><div class="chart" id="c-in"></div></div>
  <div class="card"><h2>Bitrate εξόδου</h2><div class="chart" id="c-out"></div></div>
  <div class="card"><h2>Θεατές</h2><div class="chart" id="c-viewers"></div></div>
  <div class="card"><h2>CPU</h2><div class="chart" id="c-cpu"></div></div>
</div>

<div class="card">
  <h2>Ενεργές συνδέσεις</h2>
  <div class="scroll" id="live-sessions"></div>
</div>

<div class="card">
  <h2>Πρόσφατες συνδέσεις</h2>
  <div class="scroll" id="past-sessions"></div>
</div>

<script>
  const SLOTS = ["--s1", "--s2", "--s3"];
  const streamColors = new Map(); // το χρώμα ακολουθεί το stream, όχι τη σειρά του
  const colorOf = (name) => {
    if (!streamColors.has(name)) {
      streamColors.set(name, `var(${SLOTS[streamColors.size % SLOTS.length]})`);
    }
    return streamColors.get(name);
  };

  // Συμπαγές, αλλιώς τα labels του άξονα ξεφεύγουν από το viewBox
  const bps = (v) => v >= 1e9 ? (v / 1e9).toFixed(1) + " Gbps"
    : v >= 1e8 ? Math.round(v / 1e6) + " Mbps"
    : v >= 1e6 ? (v / 1e6).toFixed(1) + " Mbps"
    : v >= 1e3 ? Math.round(v / 1e3) + " kbps" : Math.round(v) + " bps";
  const bytes = (v) => v >= 1e9 ? (v / 1e9).toFixed(1) + " GB"
    : v >= 1e6 ? (v / 1e6).toFixed(1) + " MB" : Math.round(v / 1e3) + " kB";
  const dur = (s) => {
    s = Math.max(0, Math.round(s));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? `${d}μ ${h}ω` : h ? `${h}ω ${m}λ` : `${m}λ ${s % 60}δ`;
  };
  const clock = (ts) => new Date(ts * 1000)
    .toLocaleString("el-GR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const el = (id) => document.getElementById(id);

  function table(head, rows) {
    if (!rows.length) return `<div class="empty">Καμία εγγραφή</div>`;
    const th = head.map((h) => `<th class="${h.num ? "num" : ""}">${h.label}</th>`).join("");
    const tr = rows.map((r) => "<tr>" + r.map((c, i) =>
      `<td class="${head[i].num ? "num" : ""}">${c}</td>`).join("") + "</tr>").join("");
    return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  }

  // --- chart -----------------------------------------------------------------
  function lineChart(host, series, fmt, from, to, bucket) {
    const live = series.filter((s) => s.points.length);
    if (!live.length) {
      host.innerHTML = `<div class="empty">Δεν υπάρχουν δεδομένα για αυτό το διάστημα</div>`;
      return;
    }
    const W = 640, H = 190, PL = 66, PR = 12, PT = 10, PB = 24;
    const max = Math.max(1, ...live.flatMap((s) => s.points.map((p) => p[1])));
    const top = niceMax(max);
    const x = (t) => PL + (t - from) / Math.max(1, to - from) * (W - PL - PR);
    const y = (v) => PT + (1 - v / top) * (H - PT - PB);

    const grid = [0, .5, 1].map((f) => {
      const v = top * f, yy = y(v).toFixed(1);
      return `<line x1="${PL}" x2="${W - PR}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>
        <text x="${PL - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle"
          fill="var(--muted)" font-size="11">${fmt(v)}</text>`;
    }).join("");

    const ticks = [0, .33, .66, 1].map((f) => {
      const t = from + (to - from) * f;
      return `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}"
        fill="var(--muted)" font-size="11">${clock(t)}</text>`;
    }).join("");

    const paths = live.map((s) => {
      const d = s.points.map((p) => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
      return `<polyline points="${d}" fill="none" stroke="${s.color}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join("");

    const legend = live.length > 1
      ? `<div class="legend">` + live.map((s) =>
        `<span><i class="swatch" style="background:${s.color}"></i>${s.name}</span>`).join("") + `</div>`
      : "";

    host.innerHTML = legend +
      `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="χρονοσειρά">
        ${grid}${ticks}
        <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>
        <g id="cross"></g>${paths}
      </svg><div class="tip"></div>`;

    const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), cross = host.querySelector("#cross");
    svg.addEventListener("pointermove", (ev) => {
      const box = svg.getBoundingClientRect();
      const t = from + (ev.clientX - box.left) / box.width * W < PL ? from
        : from + ((ev.clientX - box.left) / box.width * W - PL) / (W - PL - PR) * (to - from);
      // Σειρά χωρίς δείγμα κοντά στον δείκτη δεν μπαίνει στο tooltip — αλλιώς
      // δείχνει τιμή σε διάστημα που το stream ήταν εκτός.
      const rows = live.map((s) => ({
        s, p: s.points.reduce((a, b) => Math.abs(b[0] - t) < Math.abs(a[0] - t) ? b : a),
      })).filter((r) => Math.abs(r.p[0] - t) <= bucket * 1.5);
      if (!rows.length) {
        tip.style.opacity = 0;
        cross.innerHTML = "";
        return;
      }
      const at = rows[0].p[0];
      cross.innerHTML = `<line x1="${x(at).toFixed(1)}" x2="${x(at).toFixed(1)}" y1="${PT}" y2="${H - PB}"
        stroke="var(--axis)" stroke-dasharray="3 3"/>` + rows.map((r) =>
        `<circle cx="${x(r.p[0]).toFixed(1)}" cy="${y(r.p[1]).toFixed(1)}" r="4"
          fill="${r.s.color}" stroke="var(--surface-1)" stroke-width="2"/>`).join("");
      tip.innerHTML = `<b>${clock(at)}</b>` + rows.map((r) =>
        `<div class="row"><i class="swatch" style="background:${r.s.color}"></i>${r.s.name}: ${fmt(r.p[1])}</div>`).join("");
      tip.style.opacity = 1;
      tip.style.left = Math.min(box.width - tip.offsetWidth - 4,
        Math.max(0, x(at) / W * box.width + 10)) + "px";
      // τα <svg> δεν έχουν offsetTop, οπότε το ύψος βγαίνει από τα rects
      tip.style.top = (box.top - host.getBoundingClientRect().top + 8) + "px";
    });
    svg.addEventListener("pointerleave", () => { tip.style.opacity = 0; cross.innerHTML = ""; });
  }

  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / p * 2) / 2 * p;
  }

  // --- data ------------------------------------------------------------------
  let range = "24h";
  let liveStreamCount = 0; // το restart button το διαβάζει για να ξέρει τι μήνυμα να δείξει

  async function loadLive() {
    let d;
    try {
      d = await (await fetch("/admin/api/live")).json();
    } catch {
      el("dot").className = "dot";
      return;
    }
    el("dot").className = "dot" + (d.streams.length ? " on" : "");
    liveStreamCount = d.streams.length;

    const viewers = d.streams.reduce((a, s) => a + s.viewers, 0);
    const inBps = d.streams.reduce((a, s) => a + s.in_bps, 0);
    const outBps = d.streams.reduce((a, s) => a + s.out_bps, 0);
    // Με R2 ενεργό το out_bps είναι εκτίμηση (bytes segment × θεατές) — τα .ts
    // σερβίρονται από το CDN και δεν αγγίζουν ποτέ αυτόν τον server. Δείχνε το.
    const outLabel = d.r2Estimate ? "Bitrate εξόδου (εκτ.)" : "Bitrate εξόδου";
    const outTitle = d.r2Estimate
      ? ` title="Εκτίμηση: τα .ts segments σερβίρονται από το R2, όχι μέτρηση πραγματικής κίνησης"`
      : "";
    el("tiles").innerHTML = [
      ["Streams", d.streams.length, ""],
      ["Θεατές", viewers, ""],
      ["Bitrate εισόδου", bps(inBps), ""],
      [outLabel, bps(outBps), outTitle],
      ["Uptime", dur(d.server.uptime), ""],
      ["Μνήμη", d.server.rss_mb + " <small>MB</small>", ""],
    ].map(([label, value, title]) =>
      `<div class="tile"${title}><div class="label">${label}</div><div class="value">${value}</div></div>`).join("");

    el("streams").innerHTML = table(
      [{ label: "Stream" }, { label: "Πηγή" }, { label: "Βίντεο" }, { label: "Ήχος" },
      { label: "Θεατές", num: 1 }, { label: "Είσοδος", num: 1 }, { label: "Έξοδος", num: 1 }, { label: "Διάρκεια", num: 1 }],
      d.streams.map((s) => [
        `<a href="/admin/player?stream=${encodeURIComponent(s.stream)}" target="_blank"><b>${s.stream}</b></a>`,
        `${s.protocol} · ${s.ip}`, `${s.video} ${s.resolution}`, s.audio,
        s.viewers, bps(s.in_bps), bps(s.out_bps), dur((Date.now() - s.since) / 1000),
      ]));

    el("live-sessions").innerHTML = table(
      [{ label: "Stream" }, { label: "Τύπος" }, { label: "Πρωτόκολλο" }, { label: "IP" },
      { label: "Λήψη", num: 1 }, { label: "Αποστολή", num: 1 }, { label: "Διάρκεια", num: 1 }, { label: "" }],
      d.sessions.map((s) => [
        s.stream, s.publisher ? "publisher" : "θεατής", s.protocol, s.ip,
        bytes(s.inBytes), bytes(s.outBytes), dur((Date.now() - s.since) / 1000),
        `<button class="kill" data-id="${s.id}">kill</button>`,
      ]));
  }

  async function loadSeries() {
    const d = await (await fetch("/admin/api/series?range=" + range)).json();
    const to = Math.floor(Date.now() / 1000);
    const byStream = (field) => {
      const m = new Map();
      for (const r of d.streams) {
        if (!m.has(r.stream)) m.set(r.stream, { name: r.stream, color: colorOf(r.stream), points: [] });
        m.get(r.stream).points.push([r.t, r[field]]);
      }
      return [...m.values()];
    };
    lineChart(el("c-in"), byStream("in_bps"), bps, d.from, to, d.bucket);
    lineChart(el("c-out"), byStream("out_bps"), bps, d.from, to, d.bucket);
    lineChart(el("c-viewers"), byStream("viewers"), (v) => Math.round(v), d.from, to, d.bucket);
    lineChart(el("c-cpu"), [{
      name: "CPU", color: "var(--s1)", points: d.server.map((r) => [r.t, r.cpu_pct]),
    }], (v) => v.toFixed(0) + "%", d.from, to, d.bucket);
  }

  async function loadPast() {
    const rows = await (await fetch("/admin/api/sessions")).json();
    el("past-sessions").innerHTML = table(
      [{ label: "Stream" }, { label: "Τύπος" }, { label: "Πρωτόκολλο" }, { label: "IP" },
      { label: "Έναρξη" }, { label: "Διάρκεια", num: 1 }, { label: "Λήψη", num: 1 }, { label: "Αποστολή", num: 1 }],
      rows.map((r) => [
        r.stream, r.publisher ? "publisher" : "θεατής", r.protocol, r.ip,
        clock(r.start_ts), dur(r.end_ts - r.start_ts), bytes(r.in_bytes), bytes(r.out_bytes),
      ]));
  }

  el("ranges").innerHTML = ["1h", "24h", "7d", "30d"].map((r) =>
    `<button data-range="${r}" aria-pressed="${r === range}">${r}</button>`).join("");

  document.addEventListener("click", async (ev) => {
    const rangeBtn = ev.target.closest("[data-range]");
    if (rangeBtn) {
      range = rangeBtn.dataset.range;
      for (const b of el("ranges").children) b.setAttribute("aria-pressed", b === rangeBtn);
      loadSeries();
    }
    if (ev.target.id === "restart") {
      const msg = liveStreamCount
        ? "Υπάρχει ενεργή εκπομπή — το restart θα την κόψει. Συνέχεια;"
        : "Restart του server;";
      if (!confirm(msg)) return;
      const btn = ev.target;
      btn.disabled = true;
      btn.textContent = "γίνεται restart…";
      await fetch("/admin/api/restart", { method: "POST" });
      // Ο server τερματίζει λίγα ms μετά το 202 (πρώτα σκοτώνει τα ffmpeg jobs —
      // δες app.js) και τον ξανασηκώνει ο supervisor. Poll μέχρι να ξαναπαντήσει,
      // μετά reload — αλλιώς το UI μένει παγωμένο στο "γίνεται restart…".
      const poll = setInterval(async () => {
        try {
          // Το status θέλει έλεγχο, όχι μόνο το ότι δεν πέταξε το fetch: όσο ο
          // server είναι κάτω ο Caddy απαντάει 502 — κανονική απόκριση, οπότε
          // σκέτο await θα έκανε reload πάνω στη σελίδα σφάλματος του Caddy.
          const r = await fetch("/admin/api/live");
          if (!r.ok) return;
          clearInterval(poll);
          location.reload();
        } catch {}
      }, 1000);
      return;
    }
    const killBtn = ev.target.closest(".kill");
    if (killBtn) {
      killBtn.disabled = true;
      await fetch("/admin/api/sessions/" + killBtn.dataset.id, { method: "DELETE" });
      loadLive();
    }
  });

  const refresh = () => { loadLive(); loadPast(); };
  refresh();
  loadSeries();
  setInterval(refresh, 5000);
  setInterval(loadSeries, 60000);
</script>
