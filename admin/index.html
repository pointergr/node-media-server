<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream server</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --plane: #eeede8; /* πιο σκούρο από τις κάρτες, αλλιώς #f9f9f7 vs #fcfcfb δεν ξεχωρίζει */
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, .1);
    --good: #0ca30c;
    --live: #d93a2b; /* ίδιο και στα δύο θέματα: πιο ανοιχτό κόκκινο πέφτει κάτω από 4.5:1 με λευκά γράμματα */
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme=light])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-primary: #fff;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, .1);
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 1600px; /* σε ultrawide τα charts γίνονται σύρματα και το preview τοίχος */
    padding: 24px;
    background: var(--plane);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: var(--text-secondary); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }
  .spacer { flex: 1; }
  .ranges { display: flex; gap: 4px; }
  button {
    font: inherit; color: var(--text-secondary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { color: var(--text-primary); }
  button[aria-pressed=true] { color: var(--text-primary); border-color: var(--axis); font-weight: 600; }
  /* Χωρίς δικό του padding/font-size: κληρονομεί των υπολοίπων, αλλιώς κάθεται πιο κοντό στη σειρά */
  #restart { color: #fff; background: var(--live); border-color: var(--live); }
  #restart:hover { color: #fff; filter: brightness(1.1); }
  #restart:disabled { opacity: .65; cursor: default; filter: none; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  /* Το min(100%,…) κρατάει το κάτω φράγμα κάτω από 400px σε κινητό, αλλιώς η
     κάρτα ξεχειλίζει και σκάει οριζόντιο scroll. */
  .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px; margin-bottom: 16px; }
  .hero:empty { display: none; }
  .hero .card { padding: 0; margin: 0; overflow: hidden; container-type: inline-size; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .head a { color: inherit; font-weight: 600; text-decoration: none; }
  .head a:hover { text-decoration: underline; }
  .head .since { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .onair {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px; border-radius: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #fff; background: var(--live);
  }
  .onair::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  /* Σταθερό άνω φράγμα στο preview, ό,τι περισσεύει πάει στα νούμερα: με ένα μόνο
     stream σε μεγάλη οθόνη το preview έπιανε όλο το πλάτος της κάρτας. */
  /* minmax(0,1fr) και όχι 1fr: το αυτόματο κάτω φράγμα του 1fr είναι το min-content
     του panel, δηλαδή και οι τέσσερις στήλες μαζί — έσπρωχνε το preview στα 276px. */
  .body { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); }
  .preview { position: relative; background: #000; aspect-ratio: 16 / 9; }
  .preview video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .play {
    position: absolute; inset: 0; width: 100%; padding: 0; border: 0; border-radius: 0;
    background: transparent; color: #fff; font-size: 34px; opacity: .7; cursor: pointer;
  }
  .play:hover { opacity: 1; background: rgba(255, 255, 255, .07); color: #fff; }
  /* 2x2 δίπλα σε άλλη κάρτα, 4 σε σειρά όταν είναι μόνη της — και στις δύο
     περιπτώσεις κεντραρισμένα στον χώρο δεξιά από το preview.
     Ρητό πλήθος στηλών με φράγμα πλάτους, όχι auto-fit με 1fr: τα 1fr απλώνουν τα
     νούμερα σε όλο το πλάτος της κάρτας, ενώ definite max μέσα σε auto-fit αλλάζει
     και το πλήθος των tracks. Το κεντράρισμα θέλει justify-content — margin auto ή
     justify-self κάνουν το κουτί shrink-to-fit και ξεχειλίζει στις στενές κάρτες. */
  .stat {
    margin: 0; padding: 16px; align-content: center; justify-content: center;
    display: grid; grid-template-columns: repeat(2, minmax(0, 120px)); gap: 14px;
  }
  /* Container και όχι media query: το πλάτος της κάρτας το ορίζει το πλήθος των
     streams, όχι μόνο το viewport. Το κατώφλι είναι εκεί που χωράνε 4 στήλες. */
  @container (min-width: 1120px) {
    .stat { grid-template-columns: repeat(4, minmax(0, 140px)); }
  }
  .stat dt { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .stat dd { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .meta { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
  .quiet { color: var(--muted); text-align: center; padding: 30px; }
  @media (max-width: 560px) { .body { grid-template-columns: minmax(0, 1fr); } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .tile .value small { font-size: 14px; font-weight: 400; color: var(--text-secondary); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .chart { position: relative; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 2;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
  }
  .tip b { font-weight: 600; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid);
  }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; padding-right: 16px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .kill {
    color: var(--text-secondary); border-color: var(--border);
    padding: 2px 8px; font-size: 12px;
  }
  .scroll { overflow-x: auto; }
</style>

<header>
  <span class="dot" id="dot"></span>
  <h1>Stream server</h1>
  <span class="spacer"></span>
  <button id="restart">Restart server</button>
  <div class="ranges" id="ranges"></div>
</header>

<div class="hero" id="hero"></div>
<div class="card" id="no-stream" hidden><div class="quiet">Καμία ενεργή εκπομπή</div></div>

<div class="card tiles" id="tiles"></div>

<div class="charts" id="charts">
  <div class="card"><h2>Bitrate εισόδου</h2><div class="chart" id="c-in"></div></div>
  <div class="card"><h2>Bitrate εξόδου</h2><div class="chart" id="c-out"></div></div>
  <div class="card"><h2>Θεατές</h2><div class="chart" id="c-viewers"></div></div>
  <div class="card"><h2>CPU</h2><div class="chart" id="c-cpu"></div></div>
</div>

<div class="card">
  <h2>Ενεργές συνδέσεις</h2>
  <div class="scroll" id="live-sessions"></div>
</div>

<div class="card">
  <h2>Πρόσφατες συνδέσεις</h2>
  <div class="scroll" id="past-sessions"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
  // Πορτοκαλί πρώτο: το ένα stream είναι η συνηθισμένη περίπτωση και το μπλε
  // μένει έτσι αποκλειστικά για το CPU, που δεν είναι stream.
  const SLOTS = ["--s2", "--s1", "--s3"];
  const streamColors = new Map(); // το χρώμα ακολουθεί το stream, όχι τη σειρά του
  const colorOf = (name) => {
    if (!streamColors.has(name)) {
      streamColors.set(name, `var(${SLOTS[streamColors.size % SLOTS.length]})`);
    }
    return streamColors.get(name);
  };

  // Συμπαγές, αλλιώς τα labels του άξονα ξεφεύγουν από το viewBox
  const bps = (v) => v >= 1e9 ? (v / 1e9).toFixed(1) + " Gbps"
    : v >= 1e8 ? Math.round(v / 1e6) + " Mbps"
    : v >= 1e6 ? (v / 1e6).toFixed(1) + " Mbps"
    : v >= 1e3 ? Math.round(v / 1e3) + " kbps" : Math.round(v) + " bps";
  const bytes = (v) => v >= 1e9 ? (v / 1e9).toFixed(1) + " GB"
    : v >= 1e6 ? (v / 1e6).toFixed(1) + " MB" : Math.round(v / 1e3) + " kB";
  const dur = (s) => {
    s = Math.max(0, Math.round(s));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? `${d}μ ${h}ω` : h ? `${h}ω ${m}λ` : `${m}λ ${s % 60}δ`;
  };
  const clock = (ts) => new Date(ts * 1000)
    .toLocaleString("el-GR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const el = (id) => document.getElementById(id);

  function table(head, rows) {
    if (!rows.length) return `<div class="empty">Καμία εγγραφή</div>`;
    const th = head.map((h) => `<th class="${h.num ? "num" : ""}">${h.label}</th>`).join("");
    const tr = rows.map((r) => "<tr>" + r.map((c, i) =>
      `<td class="${head[i].num ? "num" : ""}">${c}</td>`).join("") + "</tr>").join("");
    return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  }

  // --- hero ------------------------------------------------------------------
  // Οι κάρτες ζουν όσο ζει το stream και ενημερώνονται in place: με innerHTML σε
  // κάθε refresh των 5s το <video> του preview θα ξεκινούσε από την αρχή.
  const heroCards = new Map();

  // Ο preview μετράει ως κανονικός HLS θεατής (cookie nmsv στο playlist), οπότε
  // δεν ξεκινάει μόνος του — ένα dashboard ανοιχτό όλη μέρα θα φούσκωνε τους
  // ίδιους αριθμούς που δείχνει.
  function playPreview(video, src) {
    if (!window.Hls?.isSupported()) {
      // Safari: δεν έχει MSE για TS, αλλά παίζει HLS native
      video.src = src;
      return video.play().catch(() => {});
    }
    const hls = new Hls();
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    // Το πρώτο segment αργεί λίγο μετά το postPublish· χωρίς retry ένα κλικ πολύ
    // νωρίς άφηνε μαύρο κουτί για πάντα.
    hls.on(Hls.Events.ERROR, (_, d) => d.fatal && setTimeout(() => hls.loadSource(src), 3000));
    hls.loadSource(src);
    hls.attachMedia(video);
    video.hls = hls;
  }

  function heroCard(stream) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="head">
        <span class="onair">ON AIR</span>
        <a href="/admin/player?stream=${encodeURIComponent(stream)}" target="_blank">${stream}</a>
        <span class="spacer"></span>
        <span class="since" data-k="since"></span>
      </div>
      <div class="body">
        <div class="preview">
          <video muted playsinline></video>
          <button class="play" title="preview (μετράει ως θεατής)">▶</button>
        </div>
        <dl class="stat">
          <div><dt>Θεατές</dt><dd data-k="viewers"></dd></div>
          <div><dt data-k="outLabel">Έξοδος</dt><dd data-k="out"></dd></div>
          <div><dt>Είσοδος</dt><dd data-k="in"></dd></div>
          <div><dt>Ανάλυση</dt><dd data-k="resolution"></dd></div>
        </dl>
      </div>
      <div class="meta" data-k="meta"></div>`;
    card.querySelector(".play").onclick = (ev) => {
      ev.target.remove();
      playPreview(card.querySelector("video"), stream + "/index.m3u8");
    };
    return card;
  }

  function renderHero(streams, r2Estimate) {
    for (const [stream, card] of heroCards) {
      if (streams.some((s) => s.stream === stream)) continue;
      card.querySelector("video").hls?.destroy(); // αλλιώς το hls.js συνεχίζει να ζητάει playlist
      card.remove();
      heroCards.delete(stream);
    }
    el("no-stream").hidden = streams.length > 0;
    for (const s of streams) {
      let card = heroCards.get(s.stream);
      if (!card) {
        heroCards.set(s.stream, card = heroCard(s.stream));
        el("hero").append(card);
      }
      const set = (k, v) => card.querySelector(`[data-k="${k}"]`).textContent = v;
      set("since", dur((Date.now() - s.since) / 1000));
      set("viewers", s.viewers);
      set("in", bps(s.in_bps));
      set("out", bps(s.out_bps));
      // Με R2 ενεργό το out_bps είναι εκτίμηση (bytes segment × θεατές) — τα .ts
      // σερβίρονται από το CDN και δεν αγγίζουν ποτέ αυτόν τον server. Δείχνε το,
      // με αστερίσκο και όχι με λεζάντα: το «(εκτ.)» δεν χωράει στη στήλη.
      const outLabel = card.querySelector(`[data-k="outLabel"]`);
      outLabel.textContent = r2Estimate ? "Έξοδος *" : "Έξοδος";
      outLabel.title = r2Estimate
        ? "Εκτίμηση: τα .ts segments σερβίρονται από το R2, όχι μέτρηση πραγματικής κίνησης"
        : "";
      set("resolution", s.resolution);
      set("meta", `${s.video} · ${s.audio} · ${s.protocol} από ${s.ip}`);
    }
  }

  // --- chart -----------------------------------------------------------------
  function lineChart(host, series, fmt, from, to, bucket) {
    const live = series.filter((s) => s.points.length);
    if (!live.length) {
      host.innerHTML = `<div class="empty">Δεν υπάρχουν δεδομένα για αυτό το διάστημα</div>`;
      return;
    }
    const W = 640, H = 190, PL = 66, PR = 12, PT = 10, PB = 24;
    const max = Math.max(1, ...live.flatMap((s) => s.points.map((p) => p[1])));
    const top = niceMax(max);
    const x = (t) => PL + (t - from) / Math.max(1, to - from) * (W - PL - PR);
    const y = (v) => PT + (1 - v / top) * (H - PT - PB);

    const grid = [0, .5, 1].map((f) => {
      const v = top * f, yy = y(v).toFixed(1);
      return `<line x1="${PL}" x2="${W - PR}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>
        <text x="${PL - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle"
          fill="var(--muted)" font-size="11">${fmt(v)}</text>`;
    }).join("");

    const ticks = [0, .33, .66, 1].map((f) => {
      const t = from + (to - from) * f;
      return `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}"
        fill="var(--muted)" font-size="11">${clock(t)}</text>`;
    }).join("");

    const paths = live.map((s) =>
      `<path d="${curve(s.points.map((p) => [x(p[0]), y(p[1])]))}" fill="none" stroke="${s.color}"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");

    const legend = live.length > 1
      ? `<div class="legend">` + live.map((s) =>
        `<span><i class="swatch" style="background:${s.color}"></i>${s.name}</span>`).join("") + `</div>`
      : "";

    host.innerHTML = legend +
      `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="χρονοσειρά">
        ${grid}${ticks}
        <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>
        <g id="cross"></g>${paths}
      </svg><div class="tip"></div>`;

    const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), cross = host.querySelector("#cross");
    svg.addEventListener("pointermove", (ev) => {
      const box = svg.getBoundingClientRect();
      const t = from + (ev.clientX - box.left) / box.width * W < PL ? from
        : from + ((ev.clientX - box.left) / box.width * W - PL) / (W - PL - PR) * (to - from);
      // Σειρά χωρίς δείγμα κοντά στον δείκτη δεν μπαίνει στο tooltip — αλλιώς
      // δείχνει τιμή σε διάστημα που το stream ήταν εκτός.
      const rows = live.map((s) => ({
        s, p: s.points.reduce((a, b) => Math.abs(b[0] - t) < Math.abs(a[0] - t) ? b : a),
      })).filter((r) => Math.abs(r.p[0] - t) <= bucket * 1.5);
      if (!rows.length) {
        tip.style.opacity = 0;
        cross.innerHTML = "";
        return;
      }
      const at = rows[0].p[0];
      cross.innerHTML = `<line x1="${x(at).toFixed(1)}" x2="${x(at).toFixed(1)}" y1="${PT}" y2="${H - PB}"
        stroke="var(--axis)" stroke-dasharray="3 3"/>` + rows.map((r) =>
        `<circle cx="${x(r.p[0]).toFixed(1)}" cy="${y(r.p[1]).toFixed(1)}" r="4"
          fill="${r.s.color}" stroke="var(--surface-1)" stroke-width="2"/>`).join("");
      tip.innerHTML = `<b>${clock(at)}</b>` + rows.map((r) =>
        `<div class="row"><i class="swatch" style="background:${r.s.color}"></i>${r.s.name}: ${fmt(r.p[1])}</div>`).join("");
      tip.style.opacity = 1;
      tip.style.left = Math.min(box.width - tip.offsetWidth - 4,
        Math.max(0, x(at) / W * box.width + 10)) + "px";
      // τα <svg> δεν έχουν offsetTop, οπότε το ύψος βγαίνει από τα rects
      tip.style.top = (box.top - host.getBoundingClientRect().top + 8) + "px";
    });
    svg.addEventListener("pointerleave", () => { tip.style.opacity = 0; cross.innerHTML = ""; });
  }

  // Καμπύλη με control points τα ίδια τα δείγματα και άκρα τα μέσα των τμημάτων:
  // κάθε τόξο μένει μέσα στο κυρτό περίβλημα δύο διαδοχικών σημείων, οπότε δεν
  // εφευρίσκει ούτε κορυφές ούτε βυθίσματα κάτω από το μηδέν — μια Catmull-Rom θα
  // ζωγράφιζε αρνητικό bitrate μετά από αιχμή. Τίμημα: η μεμονωμένη αιχμή
  // στρογγυλεύει λίγο.
  const xy = (p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  function curve(pts) {
    if (pts.length < 3) return "M" + pts.map(xy).join(" L");
    let d = `M${xy(pts[0])}`;
    for (let i = 1; i < pts.length - 1; i++) {
      d += ` Q${xy(pts[i])} ${xy([(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2])}`;
    }
    return `${d} L${xy(pts.at(-1))}`;
  }

  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / p * 2) / 2 * p;
  }

  // --- data ------------------------------------------------------------------
  let range = "24h";
  let liveStreamCount = 0; // το restart button το διαβάζει για να ξέρει τι μήνυμα να δείξει

  async function loadLive() {
    let d;
    try {
      d = await (await fetch("/admin/api/live")).json();
    } catch {
      el("dot").className = "dot";
      return;
    }
    el("dot").className = "dot" + (d.streams.length ? " on" : "");
    liveStreamCount = d.streams.length;

    renderHero(d.streams, d.r2Estimate);

    // Μόνο αθροίσματα και server εδώ — τα νούμερα ανά stream τα δείχνει η κάρτα.
    el("tiles").innerHTML = [
      ["Streams", d.streams.length],
      ["Θεατές", d.streams.reduce((a, s) => a + s.viewers, 0)],
      ["Συνδέσεις", d.sessions.length],
      ["Uptime", dur(d.server.uptime)],
      ["Μνήμη", d.server.rss_mb + " <small>MB</small>"],
    ].map(([label, value]) =>
      `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div></div>`).join("");

    el("live-sessions").innerHTML = table(
      [{ label: "Stream" }, { label: "Τύπος" }, { label: "Πρωτόκολλο" }, { label: "IP" },
      { label: "Λήψη", num: 1 }, { label: "Αποστολή", num: 1 }, { label: "Διάρκεια", num: 1 }, { label: "" }],
      d.sessions.map((s) => [
        s.stream, s.publisher ? "publisher" : "θεατής", s.protocol, s.ip,
        bytes(s.inBytes), bytes(s.outBytes), dur((Date.now() - s.since) / 1000),
        `<button class="kill" data-id="${s.id}">kill</button>`,
      ]));
  }

  async function loadSeries() {
    const d = await (await fetch("/admin/api/series?range=" + range)).json();
    const to = Math.floor(Date.now() / 1000);
    const byStream = (field) => {
      const m = new Map();
      for (const r of d.streams) {
        if (!m.has(r.stream)) m.set(r.stream, { name: r.stream, color: colorOf(r.stream), points: [] });
        m.get(r.stream).points.push([r.t, r[field]]);
      }
      return [...m.values()];
    };
    lineChart(el("c-in"), byStream("in_bps"), bps, d.from, to, d.bucket);
    lineChart(el("c-out"), byStream("out_bps"), bps, d.from, to, d.bucket);
    lineChart(el("c-viewers"), byStream("viewers"), (v) => Math.round(v), d.from, to, d.bucket);
    lineChart(el("c-cpu"), [{
      name: "CPU", color: "var(--s1)", points: d.server.map((r) => [r.t, r.cpu_pct]),
    }], (v) => v.toFixed(0) + "%", d.from, to, d.bucket);
  }

  async function loadPast() {
    const rows = await (await fetch("/admin/api/sessions")).json();
    el("past-sessions").innerHTML = table(
      [{ label: "Stream" }, { label: "Τύπος" }, { label: "Πρωτόκολλο" }, { label: "IP" },
      { label: "Έναρξη" }, { label: "Διάρκεια", num: 1 }, { label: "Λήψη", num: 1 }, { label: "Αποστολή", num: 1 }],
      rows.map((r) => [
        r.stream, r.publisher ? "publisher" : "θεατής", r.protocol, r.ip,
        clock(r.start_ts), dur(r.end_ts - r.start_ts), bytes(r.in_bytes), bytes(r.out_bytes),
      ]));
  }

  el("ranges").innerHTML = ["1h", "24h", "7d", "30d"].map((r) =>
    `<button data-range="${r}" aria-pressed="${r === range}">${r}</button>`).join("");

  document.addEventListener("click", async (ev) => {
    const rangeBtn = ev.target.closest("[data-range]");
    if (rangeBtn) {
      range = rangeBtn.dataset.range;
      for (const b of el("ranges").children) b.setAttribute("aria-pressed", b === rangeBtn);
      loadSeries();
    }
    if (ev.target.id === "restart") {
      const msg = liveStreamCount
        ? "Υπάρχει ενεργή εκπομπή — το restart θα την κόψει. Συνέχεια;"
        : "Restart του server;";
      if (!confirm(msg)) return;
      const btn = ev.target;
      btn.disabled = true;
      btn.textContent = "γίνεται restart…";
      await fetch("/admin/api/restart", { method: "POST" });
      // Ο server τερματίζει λίγα ms μετά το 202 (πρώτα σκοτώνει τα ffmpeg jobs —
      // δες app.js) και τον ξανασηκώνει ο supervisor. Poll μέχρι να ξαναπαντήσει,
      // μετά reload — αλλιώς το UI μένει παγωμένο στο "γίνεται restart…".
      const poll = setInterval(async () => {
        try {
          // Το status θέλει έλεγχο, όχι μόνο το ότι δεν πέταξε το fetch: όσο ο
          // server είναι κάτω ο Caddy απαντάει 502 — κανονική απόκριση, οπότε
          // σκέτο await θα έκανε reload πάνω στη σελίδα σφάλματος του Caddy.
          const r = await fetch("/admin/api/live");
          if (!r.ok) return;
          clearInterval(poll);
          location.reload();
        } catch {}
      }, 1000);
      return;
    }
    const killBtn = ev.target.closest(".kill");
    if (killBtn) {
      killBtn.disabled = true;
      await fetch("/admin/api/sessions/" + killBtn.dataset.id, { method: "DELETE" });
      loadLive();
    }
  });

  const refresh = () => { loadLive(); loadPast(); };
  refresh();
  loadSeries();
  setInterval(refresh, 5000);
  setInterval(loadSeries, 60000);
</script>
